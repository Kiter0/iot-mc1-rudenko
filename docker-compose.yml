name: flat-iot
services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    restart: unless-stopped
    ports:
      - "127.0.0.1:8883:8883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/config/acl:/mosquitto/config/acl:ro
      - ./mosquitto/config/passwd:/mosquitto/config/passwd:ro
      - ./certs/ca.crt:/mosquitto/certs/ca.crt:ro
      - ./certs/server.crt:/mosquitto/certs/server.crt:ro
      - ./certs/server.key:/mosquitto/certs/server.key:ro
      - mosquitto_data:/mosquitto/data

  openhab:
    image: openhab/openhab:4.3.0
    restart: unless-stopped
    depends_on: [mosquitto]
    ports:
      - "8080:8080"
    environment:
      TZ: Europe/Kyiv
      OPENHAB_HTTP_PORT: "8080"
    volumes:
      - ./openhab/conf:/openhab/conf
      - openhab_userdata:/openhab/userdata
      - openhab_addons:/openhab/addons

  simulator:
    build: ./simulator
    depends_on: [mosquitto]
    restart: "no"
    env_file: .env
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "8883"
      MQTT_CA: /certs/ca.crt
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
    command: ["--scenario", "${SCENARIO:-normal}"]

volumes:
  mosquitto_data:
  openhab_userdata:
  openhab_addons: